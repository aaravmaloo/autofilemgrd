[package]
name = "autofilemgrd"
version = "0.0.1"
edition = "2021"
authors= ["Aarav Maloo"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
notify = "6.1"
zip = "2.2"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
winreg = "0.52"
fs_extra = "1.3"
walkdir = "2.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
